<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ceremony Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap">
  <!-- Bump ?v= whenever style.css / app.js change: the Pages CDN caches them independently of this file. -->
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <main id="stage">
    <div id="poster">
      <div class="frame">
        <div class="kanote kanote-top"></div>
        <div class="kanote kanote-bottom"></div>
        <div class="kanote kanote-left"></div>
        <div class="kanote kanote-right"></div>
        <div class="titles">
          <p class="line" data-line="0"></p>
          <p class="line" data-line="1"></p>
          <p class="line" data-line="2"></p>
          <p class="line" data-line="3"></p>
        </div>
        <p class="line date-pill" data-line="4"></p>
      </div>
      <button type="button" id="exit-btn" aria-label="Exit fullscreen" hidden>✕</button>
      <div id="poster-actions">
        <label class="icon-btn" title="Background image">
          <input type="file" id="bg-input" accept="image/*">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </label>
        <button type="button" id="bg-clear" class="icon-btn" title="Remove background image" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </main>

  <div id="start-bar">
    <button type="button" id="start-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3l14 9-14 9z"/></svg>
      Start
    </button>
  </div>

  <div id="line-toolbar" class="group" role="group" aria-labelledby="toolbar-title" hidden>
    <div id="toolbar-title"></div>
    <div class="row">
      <label><input type="checkbox" class="f-bold"> Bold</label>
      <label>Text <input type="color" class="f-color"></label>
      <label>Stroke <input type="color" class="f-stroke-color"></label>
    </div>
    <label class="row">Text size
      <input type="range" class="f-size" min="50" max="200" step="5">
      <output class="f-size-out"></output>
    </label>
    <label class="row">Stroke width
      <input type="range" class="f-stroke-width" min="0" max="8" step="0.5">
      <output class="f-stroke-out"></output>
    </label>
    <button type="button" class="f-reset-pos">Reset position</button>
  </div>

  <script src="app.js?v=13"></script>
</body>
</html>
